<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 – Not Found</title>
    <link rel="icon" type="image/svg+xml" href="/macbook.png" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        position: relative;
      }

      /* Animated background particles */
      .particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        pointer-events: none;
        animation: float 8s infinite ease-in-out;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(-30px) translateX(20px); }
      }

      .window {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
        padding: 2rem 3rem 3rem 3rem;
        max-width: 480px;
        width: 90%;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        z-index: 10;
        transition: transform 0.3s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .window-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 2rem;
        justify-content: flex-start;
      }

      .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        display: inline-block;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .dot:hover {
        transform: scale(1.15);
      }

      .dot.red {
        background: linear-gradient(135deg, #ff6b6b, #ff5252);
        box-shadow: 0 2px 8px rgba(255, 107, 107, 0.4);
      }

      .dot.yellow {
        background: linear-gradient(135deg, #ffd93d, #ffb800);
        box-shadow: 0 2px 8px rgba(255, 184, 0, 0.4);
      }

      .dot.green {
        background: linear-gradient(135deg, #6bcf7f, #2ecc71);
        box-shadow: 0 2px 8px rgba(46, 204, 113, 0.4);
      }

      .emoji-container {
        position: relative;
        margin-bottom: 1.5rem;
      }

      .emoji {
        font-size: 4rem;
        display: inline-block;
        animation: bounce 2s infinite ease-in-out;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }

      .glitch-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 5rem;
        margin: 0;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -3px;
        animation: glitch 3s infinite;
      }

      @keyframes glitch {
        0%, 90%, 100% { transform: translate(0); }
        92% { transform: translate(-2px, 2px); }
        94% { transform: translate(2px, -2px); }
        96% { transform: translate(-2px, -2px); }
        98% { transform: translate(2px, 2px); }
      }

      .subtitle {
        color: #667eea;
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        animation: fadeIn 0.8s ease-in 0.3s both;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      p {
        color: #555;
        margin-bottom: 2rem;
        line-height: 1.6;
        font-size: 1rem;
        animation: fadeIn 0.8s ease-in 0.5s both;
      }

      .btn-container {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        animation: fadeIn 0.8s ease-in 0.7s both;
      }

      a {
        color: #fff;
        background: linear-gradient(135deg, #667eea, #764ba2);
        text-decoration: none;
        font-weight: 600;
        padding: 0.875rem 2rem;
        border-radius: 12px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        display: inline-block;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      a:active {
        transform: translateY(0);
      }

      .secondary-btn {
        background: transparent;
        color: #667eea;
        border: 2px solid #667eea;
        box-shadow: none;
      }

      .secondary-btn:hover {
        background: #667eea;
        color: #fff;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      /* Floating icons */
      .float-icon {
        position: absolute;
        font-size: 2rem;
        opacity: 0.1;
        animation: floatIcon 10s infinite ease-in-out;
      }

      @keyframes floatIcon {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(20px, -20px) rotate(90deg); }
        50% { transform: translate(0, -40px) rotate(180deg); }
        75% { transform: translate(-20px, -20px) rotate(270deg); }
      }

      @media (max-width: 640px) {
        .window {
          padding: 1.5rem 2rem 2.5rem 2rem;
        }
        h1 { font-size: 3.5rem; }
        .subtitle { font-size: 1.25rem; }
        p { font-size: 0.9rem; }
        .btn-container { flex-direction: column; }
        a { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Background particles -->
    <div class="particle" style="width: 80px; height: 80px; top: 10%; left: 15%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 60px; height: 60px; top: 60%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="width: 100px; height: 100px; top: 80%; left: 10%; animation-delay: 4s;"></div>
    <div class="particle" style="width: 40px; height: 40px; top: 30%; left: 85%; animation-delay: 1s;"></div>
    <div class="particle" style="width: 70px; height: 70px; top: 15%; left: 70%; animation-delay: 3s;"></div>

    <!-- Floating icons -->
    <div class="float-icon" style="top: 20%; left: 25%; animation-delay: 0s;">🔍</div>
    <div class="float-icon" style="top: 70%; left: 75%; animation-delay: 2s;">🗂️</div>
    <div class="float-icon" style="top: 50%; left: 10%; animation-delay: 4s;">💻</div>
    <div class="float-icon" style="top: 15%; right: 15%; animation-delay: 1s;">📁</div>

    <div class="window">
      <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      
      <div class="emoji-container">
        <div class="emoji">🕵️‍♂️</div>
      </div>
      
      <div class="glitch-wrapper">
        <h1>404</h1>
      </div>
      
      <div class="subtitle">Page Not Found</div>
      
      <p>
        Oops! The page you're looking for has gone missing.<br />
        It might have been moved, deleted, or never existed.<br />
        Let's get you back on track!
      </p>
      
      <div class="btn-container">
        <a href="/">Return to Desktop</a>
        <a href="javascript:history.back()" class="secondary-btn">Go Back</a>
      </div>
    </div>

    <script>
      // Add hover effect to window controls
      document.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', function() {
          if (this.classList.contains('red')) {
            window.location.href = '/';
          } else if (this.classList.contains('yellow')) {
            alert('Minimize? This is a 404 page! 😄');
          } else if (this.classList.contains('green')) {
            document.querySelector('.window').style.transform = 'scale(1.05)';
            setTimeout(() => {
              document.querySelector('.window').style.transform = 'scale(1)';
            }, 200);
          }
        });
      });

      // Add parallax effect on mouse move
      document.addEventListener('mousemove', (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
        const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
        document.querySelector('.window').style.transform = `translate(${moveX}px, ${moveY}px)`;
      });
    </script>
  </body>
</html>
